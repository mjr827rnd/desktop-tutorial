<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Seoul Deck.gl 3D Grid System</title>
    
    <script src="https://unpkg.com/deck.gl@latest/dist.min.js"></script>
    <script src='https://api.tiles.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js'></script>
    <link href='https://api.tiles.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css' rel='stylesheet' />

    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; }
        /* 툴팁 스타일 */
        #tooltip {
            position: absolute; z-index: 1; pointer-events: none; display: none;
            background: rgba(0, 0, 0, 0.8); color: #fff; padding: 10px;
            border-radius: 4px; font-family: sans-serif; font-size: 12px;
            border: 1px solid #555;
        }
    </style>
</head>
<body>

    <div id="tooltip"></div>

    <div id="container" style="width: 100vw; height: 100vh;"></div>

    <script>
        // =================================================================
        // 🔑 중요: Mapbox 토큰 입력 (https://account.mapbox.com/ 에서 발급)
        // 토큰이 없으면 지도가 안 보이고 검은 화면에 데이터만 둥둥 떠다닙니다.
        const MAPBOX_TOKEN = 'pk.eyJ1IjoibWpyaTI3cm5kIiwiYSI6ImNtaWZ4NjZuZjAwd3czZ3Bmd3JhM3lyZnUifQ.B2d_rY8ItdoGlgGCdHHxeQ'; 
        // =================================================================

        const {DeckGL, GeoJsonLayer, PolygonLayer} = deck;

        // 1. 초기 뷰 설정 (서울 중심)
        const INITIAL_VIEW_STATE = {
            latitude: 37.5665,
            longitude: 126.9780,
            zoom: 13,
            pitch: 45, // 3D 각도 (0이면 평면, 60이면 기울어짐)
            bearing: 0 // 회전 각도
        };

        // 2. Deck.gl 레이어 정의
        // 실제로는 'seoul_grid.geojson' 파일을 로드해야 합니다.
        // 테스트를 위해 가상의 데이터를 넣는 예시 구조입니다.
        
        const deckgl = new DeckGL({
            container: 'container',
            mapStyle: 'mapbox://styles/mapbox/dark-v10', // 멋진 다크 모드 지도
            mapboxApiAccessToken: MAPBOX_TOKEN,
            initialViewState: INITIAL_VIEW_STATE,
            controller: true, // 마우스 회전/줌 허용
            
            // 레이어 목록
            layers: [
                new GeoJsonLayer({
                    id: 'grid-layer',
                    // ⚠️ Python으로 만든 GeoJSON 파일 경로를 여기에 넣으세요!
                    data: 'web_grid.geojson', 
                    
                    // 성능 최적화 옵션
                    pickable: true, // 마우스 오버 감지
                    stroked: true,  // 테두리 그리기
                    filled: true,   // 내부 채우기
                    extruded: true, // 3D 돌출 허용 (건물처럼 솟아오름)
                    wireframe: true, // 와이어프레임 표시

                    // 🎨 스타일 로직 (핵심!)
                    // is_urban(도심)이면 투명, 아니면 검은색
                    getFillColor: feature => {
                        const isUrban = feature.properties.is_urban;
                        if (isUrban) {
                            return [0, 0, 0, 0]; // 투명 (R, G, B, Alpha)
                        } else {
                            return [0, 0, 0, 240]; // 검은색 + 약간의 투명도 (배경 가림)
                        }
                    },

                    // 테두리 색상
                    getLineColor: [50, 50, 50, 100], 
                    getLineWidth: 1,

                    // 3D 높이 설정 (격자 자체에 높이를 줄 수 있음)
                    getElevation: feature => {
                        // 도심 지역이 아니면 벽처럼 높게 세워서 가릴 수도 있음
                        return feature.properties.is_urban ? 0 : 50; 
                    },

                    // 마우스 오버 효과
                    autoHighlight: true,
                    highlightColor: [255, 0, 0, 100], // 빨간색 하이라이트

                    // 툴팁 이벤트
                    onHover: ({object, x, y}) => {
                        const el = document.getElementById('tooltip');
                        if (object) {
                            el.innerHTML = `
                                <strong>격자 정보</strong><br>
                                상태: ${object.properties.is_urban ? '🏙️ 도심(오픈)' : '⬛ 차단됨'}
                            `;
                            el.style.display = 'block';
                            el.style.left = x + 'px';
                            el.style.top = y + 'px';
                        } else {
                            el.style.display = 'none';
                        }
                    }
                })
            ],

            // 로딩 중일 때 표시
            onLoad: () => {
                console.log("Deck.gl 로드 완료! 서울을 비행해보세요. (Ctrl + 드래그로 회전)");
            }
        });
    </script>
</body>
</html>
